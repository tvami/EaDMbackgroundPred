# One shard is <=750k events; the padded float32 tensor is chunked at 500k
# (500k x 64 x 4 x 4 B = 512 MB) and the jagged AsNumpy read is the real consumer,
# measured at 1-3 GB resident. 8 GB is ample.
request_cpus                                    = 4
# 12 GB (was 8): arm 1 needs a second, median-centered copy of the padded tensor
# (another 512 MB at CHUNK=500k) plus a float64 scratch array for the nanmedian.
request_memory                                  = 12000
request_disk                                    = 4GB
Output                                          = logs/rescore_$(Cluster)_$(Process).stdout
Error                                           = logs/rescore_$(Cluster)_$(Process).stderr
Log                                             = logs/rescore_$(Cluster)_$(Process).log
# The fourteen checkpoints are scored in a single pass per shard, so the expensive
# jagged read happens once instead of fourteen times. Sp (371730) / Wp (371731)
# are the one-variable shift/smear gradients off E1. rnn_v5_188k_final_weights is a
# symlink into smasanam's area; condor transfers the dereferenced content.
