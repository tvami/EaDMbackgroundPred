universe                                        = vanilla
Executable                                      = /home/users/tvami/EarthAsDM/CMSSW_14_1_0_pre4/src/helper_scripts/rnn_4arm_rescore/run_rescore_batch.sh
Should_Transfer_Files                           = YES
WhenToTransferOutput                            = ON_EXIT
x509userproxy                                   = /tmp/x509up_u81951
initialdir                                      = /home/users/tvami/EarthAsDM/CMSSW_14_1_0_pre4/src/helper_scripts/rnn_4arm_rescore
# One shard is <=750k events; the padded float32 tensor is chunked at 500k
# (500k x 64 x 4 x 4 B = 512 MB) and the jagged AsNumpy read is the real consumer,
# measured at 1-3 GB resident. 8 GB is ample.
request_cpus                                    = 4
request_memory                                  = 8000
request_disk                                    = 4GB
Output                                          = logs/rescore_$(Cluster)_$(Process).stdout
Error                                           = logs/rescore_$(Cluster)_$(Process).stderr
Log                                             = logs/rescore_$(Cluster)_$(Process).log
# The four checkpoints are scored in a single pass per shard, so the expensive
# jagged read happens once instead of four times. rnn_v5_188k_final_weights is a
# symlink into smasanam's area; condor transfers the dereferenced content.
transfer_input_files                            = /home/users/tvami/EarthAsDM/CMSSW_14_1_0_pre4/src/helper_scripts/rnn_4arm_rescore/rescore_arms.py, /home/users/tvami/EarthAsDM/CMSSW_14_1_0_pre4/src/helper_scripts/rnn_input_prep.py, /home/users/tvami/EarthAsDM/CMSSW_14_1_0_pre4/src/helper_scripts/rnn_retrain_weights_absoluteT0_control.ckpt.data-00000-of-00001, /home/users/tvami/EarthAsDM/CMSSW_14_1_0_pre4/src/helper_scripts/rnn_retrain_weights_absoluteT0_control.ckpt.index, /home/users/tvami/EarthAsDM/CMSSW_14_1_0_pre4/src/helper_scripts/rnn_retrain_weights_shift8ns_absolute.ckpt.data-00000-of-00001, /home/users/tvami/EarthAsDM/CMSSW_14_1_0_pre4/src/helper_scripts/rnn_retrain_weights_shift8ns_absolute.ckpt.index, /home/users/tvami/EarthAsDM/CMSSW_14_1_0_pre4/src/helper_scripts/rnn_retrain_weights_smear12ns_absolute.ckpt.data-00000-of-00001, /home/users/tvami/EarthAsDM/CMSSW_14_1_0_pre4/src/helper_scripts/rnn_retrain_weights_smear12ns_absolute.ckpt.index, /home/users/tvami/EarthAsDM/CMSSW_14_1_0_pre4/src/helper_scripts/rnn_v5_188k_final_weights.ckpt.data-00000-of-00001, /home/users/tvami/EarthAsDM/CMSSW_14_1_0_pre4/src/helper_scripts/rnn_v5_188k_final_weights.ckpt.index
# NEVER set this to "" -- an empty list is what lost the round-1 RNN training
# (cluster 369968). One npz per shard, remapped into out/.
transfer_output_files                           = $(name).npz
transfer_output_remaps                          = "$(name).npz = out/$(name).npz"
+JobFlavour                                     = "workday"
# UCSD ONLY. The shards read their input straight off /ceph, which is UCSD-local:
# anywhere else the file is invisible and the job dies. Cluster 370950 lost all four
# RNN training arms to Purdue exactly this way. The wrapper now tests -f on the input
# and exits 1 with a named error instead of writing an empty npz.
+DESIRED_Sites                                  = "T2_US_UCSD"
+SingularityImage                               = "/cvmfs/singularity.opensciencegrid.org/cmssw/cms:rhel8"
+REQUIRED_OS                                    = "el8"
# Measured interactively: 78k events x 4 networks = 174 s. A 750k-event shard is
# therefore ~30 min of inference plus the ceph read; 4 h is generous headroom.
+MaxWallTimeMins                                = 240

# Arguments: outname  ISTART  ISTOP  input-root-path
Arguments                                       = $(name) $(istart) $(istop) $(path)
queue name,istart,istop,path from /home/users/tvami/EarthAsDM/CMSSW_14_1_0_pre4/src/helper_scripts/rnn_4arm_rescore/joblist_fix.txt
