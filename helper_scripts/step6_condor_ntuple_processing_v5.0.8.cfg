# step6 production for skimmed ntuple version v5.0.8_wRNN
#   RNN  = rnn_v5_188k_final_weights.ckpt   (the DEPLOYED v5 network, unchanged)
#   + 8.0 ns t0 shift on MC/Signal at INFERENCE          (argument 8)
#   + NOMINAL WORKING POINT MOVED 0.9999 -> 0.99999      (argument 11)
#   + RNN_scale cuts re-derived AT that working point    (arguments 9/10)
#
# WHY THE WORKING POINT MOVED. At 0.9999 the v5+8ns configuration scores 0.85-0.90 in
# S/sqrt(B) relative to the v28 baseline -- i.e. worse. Tightening to 0.99999 cuts the
# SR data from 127 to 36 events while signal efficiency falls only from ~0.53 to ~0.44
# (MinP-1000), lifting S/sqrt(B) to 0.98-1.30 across the whole mass range. Unlike E1
# (v5.0.6), it does not collapse at high mass. Scan: /tmp/sr_study/v507_effscan.txt.
#
# RNN_scale CUTS. Re-derived for THIS network at THIS working point with
# rnn_4arm_rescore/derive_rnn_scale_cuts.py --column old_v5 --suffix _shift8 --wp 0.99999:
#     nominal eff 0.3226 (mean over the 18 depth-e4 masses)
#     +4% eff  0.9999874830   ->  1.0392 x nominal
#     -4% eff  0.9999920130   ->  0.9599 x nominal
#     per-mass spread 1.030-1.054 (up), 0.950-0.966 (down) -- that residual spread IS
#     the shape content, which is why one global pair is used rather than a per-mass cut.
# The tool reproduces the documented v5 pair at 0.9999 to all ten digits, which is how
# the method was validated. The python script now ASSERTS up < nominal < down, so a
# moved working point can no longer be paired with stale cuts.
#
# The v5 pair used by v5.0.7 (0.9998533130 / 0.9999332428) is WRONG here -- it sits
# entirely below 0.99999 and would give a one-sided systematic.
#
# DATA IS NOT SHIFTED. -S applies only when sampleType != Data, so the SR data yield is
# the unshifted v5 one: 36 events at 0.99999 (127 at 0.9999).
#
# NOTE -- jobs CANNOT write to /ceph. The wrapper's cp reports success but lands in the
# el8 container overlay; the real output returns via transfer_output_files = output/,
# whose trailing slash unpacks the CONTENTS into prod_v5.0.8/{Data,Signal,BkgMC}/.
# rsync to ceph afterwards and verify counts. Do not trust the job log's "Transfer
# complete".
#
# 504 jobs = 144 signals x 3 regions + 22 data x 3 + 2 BkgMC x 3, in one list (504 jobs
# collapse to 498 files: the 22 data entries per region merge to 20).
universe                                        = vanilla
Executable                                      = /home/users/tvami/EarthAsDM/CMSSW_14_1_0_pre4/src/helper_scripts/run_ntuple_processing_batch.sh
Should_Transfer_Files                           = YES
WhenToTransferOutput                            = ON_EXIT
x509userproxy                                   = /tmp/x509up_u81951
initialdir                                      = /home/users/tvami/EarthAsDM/CMSSW_14_1_0_pre4/src/helper_scripts/prod_v5.0.8
request_cpus                                    = 4
request_memory                                  = 6000
request_disk                                    = 4GB
Output                                          = logs/output_$(Cluster)_$(Process).stdout
Error                                           = logs/output_$(Cluster)_$(Process).stderr
Log                                             = logs/output_$(Cluster)_$(Process).log
transfer_input_files                            = /home/users/tvami/EarthAsDM/CMSSW_14_1_0_pre4/src/helper_scripts/skimmed_ntuple_processing_script.py, /home/users/tvami/EarthAsDM/CMSSW_14_1_0_pre4/src/helper_scripts/rnn_v5_188k_final_weights.ckpt.data-00000-of-00001, /home/users/tvami/EarthAsDM/CMSSW_14_1_0_pre4/src/helper_scripts/rnn_v5_188k_final_weights.ckpt.index
transfer_output_files                           = output/
Arguments                                       = $(input_file) $(ntuple_version) $(sample_type) $(region) $(collection) $(run_type) ./rnn_v5_188k_final_weights.ckpt 8.0 0.9999874830 0.9999920130 0.99999
+JobFlavour                                     = "longlunch"
# UCSD ONLY: inputs are read off /ceph and the wrapper writes results back to it.
+DESIRED_Sites                                  = "T2_US_UCSD"
+REQUIRED_OS                                    = "el8"
+MaxWallTimeMins                                = 140
Queue input_file, ntuple_version, sample_type, region, collection, run_type from /home/users/tvami/EarthAsDM/CMSSW_14_1_0_pre4/src/helper_scripts/input_ntuples_v5.0.8.txt
