# step6 production for skimmed ntuple version v5.0.6_wRNN -- NON-TAGGED signal only
#   RNN = rnn_retrain_weights_matchL0toData_shift11p0_smear7p7.ckpt   ("E1")
#
# Companion to step6_condor_ntuple_processing_v5.0.6.cfg. That cfg's input list
# (input_ntuples_v5.0.6.txt, 339 entries) covers Data, BkgMC and the 89 DEPTH-TAGGED
# signal points (SurfaceDepth-e2..e6) per region -- but NOT the 55 non-tagged
# (fine-scan, no SurfaceDepth token) signal points. Those have always been a separate
# submission: v5.0.4/v28 got them from step6_condor_ntuple_processing_nontagged.cfg.
#
# Skipping this step is not cosmetic. The nominal limit chain reads the NON-tagged
# areas exclusively -- exp_lim/signal_rpf2x0_Binningv13_Inputv28_SR_Blind_alpha_max.txt
# has 171 entries and zero `_eN` tokens -- so a histogram dir built from the 339-entry
# list alone yields 276 files (v26/v27 count) and cannot set the nominal limit. v28's
# 708 = 276 + these 165 + 267 spurious EaDM_BkgMC_<signal> duplicates left by a second
# run of collect_and_merge_histograms.py (its Step 6 renames leftover EaDM_Signal_*
# to EaDM_BkgMC_*, then Step 7 copies the signal files back in). Those 267 are byte-
# identical to their EaDM_Signal_ twins and nothing reads them -- do NOT reproduce them.
#
# Same E1 checkpoint, same no-shift/no-smear inference (argument 8 = 0), and the same
# initialdir as the main v5.0.6 submission so the returned output/ trees merge into one
# prod_v5.0.6/{Data,BkgMC,Signal} layout for organizeSkimmedNtuples.sh.
universe                                        = vanilla
Executable                                      = /home/users/tvami/EarthAsDM/CMSSW_14_1_0_pre4/src/helper_scripts/run_ntuple_processing_batch.sh
Should_Transfer_Files                           = YES
WhenToTransferOutput                            = ON_EXIT
x509userproxy                                   = /tmp/x509up_u81951
initialdir                                      = /home/users/tvami/EarthAsDM/CMSSW_14_1_0_pre4/src/helper_scripts/prod_v5.0.6
request_cpus                                    = 4
request_memory                                  = 6000
request_disk                                    = 4GB
Output                                          = logs/output_$(Cluster)_$(Process).stdout
Error                                           = logs/output_$(Cluster)_$(Process).stderr
Log                                             = logs/output_$(Cluster)_$(Process).log
transfer_input_files                            = /home/users/tvami/EarthAsDM/CMSSW_14_1_0_pre4/src/helper_scripts/skimmed_ntuple_processing_script.py, /home/users/tvami/EarthAsDM/CMSSW_14_1_0_pre4/src/helper_scripts/rnn_retrain_weights_matchL0toData_shift11p0_smear7p7.ckpt.data-00000-of-00001, /home/users/tvami/EarthAsDM/CMSSW_14_1_0_pre4/src/helper_scripts/rnn_retrain_weights_matchL0toData_shift11p0_smear7p7.ckpt.index
transfer_output_files                           = output/
Arguments                                       = $(input_file) $(ntuple_version) $(sample_type) $(region) $(collection) $(run_type) ./rnn_retrain_weights_matchL0toData_shift11p0_smear7p7.ckpt 0
+JobFlavour                                     = "longlunch"
# UCSD ONLY: inputs are read off /ceph and the wrapper writes results back to it.
+DESIRED_Sites                                  = "T2_US_UCSD"
+REQUIRED_OS                                    = "el8"
+MaxWallTimeMins                                = 140
Queue input_file, ntuple_version, sample_type, region, collection, run_type from /home/users/tvami/EarthAsDM/CMSSW_14_1_0_pre4/src/helper_scripts/input_ntuples_nontagged_v5.0.6.txt
