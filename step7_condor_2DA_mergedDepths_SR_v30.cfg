# 2DAlphabet SR fits for the depth-MERGED v30 signals (18 masses, one job each).
#
# Twin of step7_condor_2DA_SR_v30.cfg. The only differences are the input list, the
# parent output directory (passed as the 4th argument so the two productions cannot
# write into each other's area) and the log names.
#
# The merged templates are produced by
#   python3 helper_scripts/merge_depths_2DA_hists.py -H histograms_for_2DAlphabet_v30 -r SR
# which props-reweights the per-depth v30 histograms. They carry the same 22 histograms
# as the per-depth files, so CMS_EXO26004_RNN_scale in the template config resolves.
universe                  = vanilla
Executable                = /home/users/tvami/EarthAsDM/CMSSW_14_1_0_pre4/src/run_2DA_SR_batch_v30.sh
Should_Transfer_Files     = YES
WhenToTransferOutput      = ON_EXIT
# The histogram input is the SLIM directory, not the full histograms_for_2DAlphabet_v30 (2.1 GB):
# a mergedDepths job reads exactly its own merged signal file plus the data file, so
# condor_slim_mergedDepths_v30/ holds hardlinks to those 19 files (123 MB) under the same basename
# the config's GLOBAL.path expects. Sandbox 572 MB instead of 2.6 GB.
#
# request_disk follows from that, and it is the whole reason this cfg is not just the per-depth one:
# the pool's five partitionable slots carve dynamic slots out of their free disk, so a 10GB request
# let uaf-2 run 2 of these jobs at once and locked uaf-3 (6.1 GB free) out entirely. At 3GB every
# machine qualifies and uaf-2 alone can run 9. Do not raise this back to 10GB without re-checking
#   condor_status -constraint 'SlotType=="Partitionable"' -af Machine Disk Memory Cpus State
transfer_input_files      = /home/users/tvami/EarthAsDM/CMSSW_14_1_0_pre4/src/run_single_signal_2DA.py,/home/users/tvami/EarthAsDM/CMSSW_14_1_0_pre4/src/config_Binningv13_Inputv30Template_SR_Blind.json,/home/users/tvami/EarthAsDM/CMSSW_14_1_0_pre4/src/2DAlphabet,/home/users/tvami/EarthAsDM/CMSSW_14_1_0_pre4/src/HiggsAnalysis,/home/users/tvami/EarthAsDM/CMSSW_14_1_0_pre4/src/CombineHarvester,/home/users/tvami/EarthAsDM/CMSSW_14_1_0_pre4/src/condor_slim_mergedDepths_v30/histograms_for_2DAlphabet_v30
transfer_output_files     = rpf2x0_Binningv13_Inputv30_mergedDepths_SR_Blind
x509userproxy             = /tmp/x509up_u81951
request_cpus              = 1
# Measured, not inherited: the completed per-depth v30 jobs peaked at 2051-2180 MB of memory and
# 2.79 GB of disk, of which ~2.1 GB was the fat histogram sandbox this cfg no longer sends. The
# per-depth cfg asks for 6000 MB / 10 GB, which on a partitionable slot buys nothing and costs
# concurrency. Check the "Partitionable Resources" block of a finished job's log before changing.
request_memory            = 4000
request_disk              = 2GB
Output                    = logs/2DA_mergedDepths_SR_v30_$(Cluster)_$(Process).stdout
Error                     = logs/2DA_mergedDepths_SR_v30_$(Cluster)_$(Process).stderr
Log                       = logs/2DA_mergedDepths_SR_v30_$(Cluster)_$(Process).log
Arguments                 = $(template_config) $(signal) $(tf_type) $(parent_dir)
+JobFlavour               = "longlunch"
+DESIRED_Sites            = "T2_US_UCSD"
#+REQUIRED_OS             = "el8"
+SingularityImage         = "/cvmfs/singularity.opensciencegrid.org/cmssw/cms:rhel8"
+MaxWallTimeMins          = 140
Queue template_config,signal,tf_type,parent_dir from input_2DA_mergedDepths_SR_v30.txt
