# 2DAlphabet SR fits for the 108 signals new in v31 (2e5/3e5/5e5 depths + low masses).
# The other 144 v31 inputs are byte-identical to v30, so their v30 fits stand.
# Per-job slim sandbox: condor_slim_perSignal_v31/<signal>/ = own file + data (hardlinks, ~7 MB).
universe                  = vanilla
Executable                = /home/users/tvami/EarthAsDM/CMSSW_14_1_0_pre4/src/run_2DA_SR_batch_v31.sh
Should_Transfer_Files     = YES
WhenToTransferOutput      = ON_EXIT
transfer_input_files      = /home/users/tvami/EarthAsDM/CMSSW_14_1_0_pre4/src/run_single_signal_2DA.py,/home/users/tvami/EarthAsDM/CMSSW_14_1_0_pre4/src/config_Binningv13_Inputv31Template_SR_Blind.json,/home/users/tvami/EarthAsDM/CMSSW_14_1_0_pre4/src/2DAlphabet,/home/users/tvami/EarthAsDM/CMSSW_14_1_0_pre4/src/HiggsAnalysis,/home/users/tvami/EarthAsDM/CMSSW_14_1_0_pre4/src/CombineHarvester,/home/users/tvami/EarthAsDM/CMSSW_14_1_0_pre4/src/condor_slim_perSignal_v31/$(signal)/histograms_for_2DAlphabet_v31
transfer_output_files     = rpf2x0_Binningv13_Inputv31_SR_Blind
x509userproxy             = /tmp/x509up_u81951
request_cpus              = 1
request_memory            = 4000
request_disk              = 2GB
Output                    = logs/2DA_SR_v31_newsignals_$(Cluster)_$(Process).stdout
Error                     = logs/2DA_SR_v31_newsignals_$(Cluster)_$(Process).stderr
Log                       = logs/2DA_SR_v31_newsignals_$(Cluster)_$(Process).log
Arguments                 = $(template_config) $(signal) $(tf_type) rpf2x0_Binningv13_Inputv31_SR_Blind
+JobFlavour               = "longlunch"
+DESIRED_Sites            = "T2_US_UCSD"
+SingularityImage         = "/cvmfs/singularity.opensciencegrid.org/cmssw/cms:rhel8"
+MaxWallTimeMins          = 140
Queue template_config,signal,tf_type from input_2DA_SR_v31_newsignals.txt
